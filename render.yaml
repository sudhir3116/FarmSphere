services:
  - type: web
    name: farmsphere-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://farmspherefinal.netlify.app,https://6ae36c2c903fa492dd80ff8e--farmspherefinal.netlify.app
      - key: SMS_PROVIDER
        value: twilio
      - key: SMS_TEST_MODE
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
